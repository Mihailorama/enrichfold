[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enrichfold"
version = "0.6.0"
description = "Provider-neutral, provenance-first entity enrichment for people and companies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mihail R." }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://mihailorama.github.io/enrichfold/"
Repository = "https://github.com/Mihailorama/enrichfold"
Issues = "https://github.com/Mihailorama/enrichfold/issues"

[project.optional-dependencies]
search = ["httpx>=0.27"]
test = ["pytest>=9.0", "pytest-asyncio>=1.3", "pytest-httpx>=0.36"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/enrichfold"]
